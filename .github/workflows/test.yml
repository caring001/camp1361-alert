name: 점검 (테스트 메일)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 예약 번호 찾기 + 현재 상태 + 테스트 메일
        env:
          NAVER_MAIL_ID: ${{ secrets.NAVER_MAIL_ID }}
          NAVER_MAIL_PASSWORD: ${{ secrets.NAVER_MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          BIZ_ID: ${{ vars.BIZ_ID }}
          ITEM_ID: ${{ vars.ITEM_ID }}
          SERVICE_ID: ${{ vars.SERVICE_ID }}
        run: python -u check.py --test
